<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Enlaces Químicos</title>
<style>
*{box-sizing:border-box;font-family:system-ui,Segoe UI,sans-serif}
body{margin:0;background:#0f172a;color:#f8fafc;padding:14px}
.wrap{max-width:920px;margin:0 auto;display:grid;gap:14px}
header,.box{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:14px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header img{width:48px;height:48px;border-radius:10px;object-fit:cover}
.grid{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:740px){.grid{grid-template-columns:1.1fr .9fr}}
input,select,button{width:100%;padding:10px;border-radius:10px;border:1px solid #334155;background:#0b1220;color:#f8fafc;font-size:.95rem}
.els{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px;max-height:290px;overflow:auto;margin-top:10px}
.el{text-align:left;cursor:pointer;padding:8px}
.el.on{border-color:#22c55e;background:#132a22}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
button.go{background:#38bdf8;color:#06131e;font-weight:700;border:none;cursor:pointer;flex:1}
button.clr{background:transparent;cursor:pointer;width:auto}
.res{margin-top:10px;background:#0b1220;border:1px solid #334155;border-radius:10px;padding:12px}
.tag{display:inline-block;padding:4px 10px;border-radius:99px;background:#172554;color:#93c5fd;font-weight:700;font-size:.85rem}
.form{font-size:1.35rem;font-weight:800;color:#22c55e;margin:6px 0}
.mut{color:#94a3b8;font-size:.88rem}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="Mascota.png" alt="Mascota" onerror="this.style.display='none'" />
    <div><b>Enlaces Químicos</b><div class="mut">Elige dos elementos para calcular fórmula y tipo de enlace</div></div>
  </header>
  <div class="grid">
    <div class="box">
      <input id="q" placeholder="Buscar elemento, símbolo o #..." />
      <div id="els" class="els"></div>
    </div>
    <div class="box">
      <div class="mut">Elemento 1</div><select id="a"></select>
      <div class="mut" style="margin-top:8px">Elemento 2</div><select id="b"></select>
      <div class="row">
        <button class="go" id="calc">Calcular enlace</button>
        <button class="clr" id="clr">Limpiar</button>
      </div>
      <div id="res" class="res"></div>
    </div>
  </div>
</div>
<script>
const E=[
  {z:1,s:"H",n:"Hidrógeno",x:2.20,t:"nm",v:1},{z:3,s:"Li",n:"Litio",x:0.98,t:"m",v:1},
  {z:4,s:"Be",n:"Berilio",x:1.57,t:"m",v:2},{z:6,s:"C",n:"Carbono",x:2.55,t:"nm",v:4},
  {z:7,s:"N",n:"Nitrógeno",x:3.04,t:"nm",v:3},{z:8,s:"O",n:"Oxígeno",x:3.44,t:"nm",v:2},
  {z:9,s:"F",n:"Flúor",x:3.98,t:"nm",v:1},{z:11,s:"Na",n:"Sodio",x:0.93,t:"m",v:1},
  {z:12,s:"Mg",n:"Magnesio",x:1.31,t:"m",v:2},{z:13,s:"Al",n:"Aluminio",x:1.61,t:"m",v:3},
  {z:15,s:"P",n:"Fósforo",x:2.19,t:"nm",v:3},{z:16,s:"S",n:"Azufre",x:2.58,t:"nm",v:2},
  {z:17,s:"Cl",n:"Cloro",x:3.16,t:"nm",v:1},{z:19,s:"K",n:"Potasio",x:0.82,t:"m",v:1},
  {z:20,s:"Ca",n:"Calcio",x:1.00,t:"m",v:2},{z:26,s:"Fe",n:"Hierro",x:1.83,t:"m",v:2},
  {z:29,s:"Cu",n:"Cobre",x:1.90,t:"m",v:2},{z:35,s:"Br",n:"Bromo",x:2.96,t:"nm",v:1}
];
const els=document.getElementById("els"),sa=document.getElementById("a"),sb=document.getElementById("b"),q=document.getElementById("q"),res=document.getElementById("res");
const mcd=(x,y)=>y?mcd(y,x%y):x;
const sub=n=>n===1?"":String(n).split("").map(d=>"₀₁₂₃₄₅₆₇₈₉"[d]).join("");
function form(u,v){if(u.s===v.s)return u.s+"₂";const d=mcd(u.v,v.v);return u.s+sub(v.v/d)+v.s+sub(u.v/d)}
E.forEach((e,i)=>{const t=`${e.z}. ${e.n} (${e.s}) · χ ${e.x}`;sa.add(new Option(t,i));sb.add(new Option(t,i))});
sa.value="7";sb.value="12";
function draw(){
  const f=q.value.trim().toLowerCase();els.innerHTML="";
  E.filter(e=>!f||e.n.toLowerCase().includes(f)||e.s.toLowerCase().includes(f)||String(e.z)===f).forEach(e=>{
    const i=E.indexOf(e),b=document.createElement("button");
    b.type="button";b.className="el"+(sa.value==i||sb.value==i?" on":"");
    b.innerHTML=`<div class="mut">#${e.z} · χ ${e.x}</div><b>${e.s}</b><div class="mut">${e.n}</div>`;
    b.onclick=()=>{if(sa.value!==String(i)){sa.value=sb.value;sb.value=String(i);draw();run()}};
    els.appendChild(b);
  });
}
function run(){
  const u=E[sa.value],v=E[sb.value],d=Math.abs(u.x-v.x);
  let tipo="Enlace Covalente No Polar",txt="Comparten electrones de forma pareja.";
  if(u.t==="m"&&v.t==="m"){tipo="Enlace Metálico";txt="Ambos son metales con electrones deslocalizados."}
  else if(d>=1.7||u.t!==v.t){tipo="Enlace Iónico";txt="Transferencia electrónica entre menor y mayor electronegatividad."}
  else if(d>=0.4){tipo="Enlace Covalente Polar";txt="Compartición desigual de electrones."}
  const [p,s]=u.x<=v.x?[u,v]:[v,u];
  res.innerHTML=`<span class="tag">${tipo}</span><div class="form">${form(p,s)}</div><div><b>${u.n}</b> (${u.x}) y <b>${v.n}</b> (${v.x}) · Δχ = <b>${d.toFixed(2)}</b></div><div class="mut">${txt}</div>`;
}
document.getElementById("calc").onclick=run;
document.getElementById("clr").onclick=()=>{q.value="";draw();res.innerHTML='<div class="mut">Listo. Selecciona dos elementos.</div>'};
q.oninput=draw;sa.onchange=()=>{draw();run()};sb.onchange=()=>{draw();run()};
draw();run();
</script>
</body>
</html>
