<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tabla Periodica y Enlaces Quimicos</title>
<style>
*{box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{margin:0;background:#0d0e11;color:#f3f4f6;padding:12px}
.app{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.hdr{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.hdr img{width:104px;height:104px;border-radius:16px;object-fit:contain;background:#181a1f;padding:6px;border:1.5px solid #374151;flex-shrink:0}
.hdr h1{margin:0;font-size:clamp(1.25rem,4vw,1.7rem);font-weight:700;letter-spacing:-.2px;line-height:1.15}
.btn-donar{margin-left:auto;background:linear-gradient(135deg,#22c55e,#15803d);color:#ffffff;border:1.5px solid #4ade80;border-radius:12px;padding:10px 14px;font-size:.82rem;font-weight:700;cursor:pointer;box-shadow:0 0 18px rgba(34,197,94,.42);max-width:340px;line-height:1.25;text-align:left;transition:transform .12s ease,box-shadow .12s ease}
.btn-donar:hover{transform:translateY(-1px);box-shadow:0 0 24px rgba(74,222,128,.6)}
.search{width:100%;background:transparent;border:none;border-bottom:1px solid #2b2f36;color:#d1d5db;padding:8px 4px;font-size:.95rem;outline:none}
.search:focus{border-bottom-color:#60a5fa}
.confirm-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-c{background:#181a1f;color:#f3f4f6;border:1px solid #262930;border-radius:14px;padding:11px 10px;font-size:.92rem;font-weight:600;cursor:pointer}
.btn-c:hover{border-color:#4b5563}
.card{background:#14161a;border:1px solid #262930;border-radius:12px;padding:12px 14px}
.status-box{min-height:62px;display:flex;flex-direction:column;justify-content:center;gap:4px}
.status-title{font-weight:700;font-size:1rem}
.info-top{display:flex;align-items:center;gap:8px;font-size:1.12rem;font-weight:700}
.ring{width:13px;height:13px;border-radius:50%;border:2.5px solid #e5e7eb;display:inline-block;flex-shrink:0}
.meta{color:#d1d5db;font-size:.9rem;margin-top:4px}
.desc{color:#9ca3af;font-size:.9rem;margin-top:4px;line-height:1.35}
.slot{border-radius:12px;padding:12px 14px;background:#121418}
.slot-1{border:1.5px solid #22c55e}
.slot-2{border:1.5px solid #eab308}
.slot-title{font-weight:700;font-size:1.02rem;margin-bottom:4px}
.slot-sub{font-weight:600;font-size:.94rem}
.slot-hint{color:#9ca3af;font-size:.86rem;margin-top:2px}
.pt-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px}
.pt-board{min-width:680px;display:flex;flex-direction:column;gap:4px}
.pt-row{display:grid;grid-template-columns:repeat(18,minmax(34px,1fr));gap:4px}
.pt-spacer{height:46px;display:flex;align-items:center;justify-content:center;color:#9ca3af;font-size:.72rem;font-weight:600}
.pt-gap{height:8px}
.el-tile{height:46px;border-radius:7px;border:1px solid #2b303a;padding:3px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;color:#f3f4f6;transition:transform .08s ease,border-color .12s ease}
.el-tile:hover{transform:translateY(-1px);border-color:#e5e7eb}
.el-tile.cat-metal{background:#1b2028;border-color:#2c3440}
.el-tile.cat-nonmetal{background:#2d2116;border-color:#4a3522}
.el-tile.cat-metalloid{background:#152b22;border-color:#23493a}
.el-tile.cat-noble{background:#182738;border-color:#28415e}
.el-tile.active{background:#f3f4f6;color:#111317;border-color:#ffffff}
.el-tile.active .el-z{color:#374151}
.el-tile.dim{opacity:.22}
.el-z{font-size:.62rem;color:#cbd5e1;line-height:1;margin-bottom:2px}
.el-s{font-size:.9rem;font-weight:700;line-height:1.1}
@media (max-width:520px){
  body{padding:10px}
  .hdr{gap:12px}
  .hdr img{width:86px;height:86px}
  .btn-donar{margin-left:0;width:100%;max-width:none}
  .confirm-row{gap:8px}
  .btn-c{padding:10px 8px;font-size:.86rem}
  .pt-board{min-width:612px}
  .pt-row{grid-template-columns:repeat(18,minmax(30px,1fr));gap:3px}
  .el-tile,.pt-spacer{height:42px}
  .el-s{font-size:.82rem}
}
</style>
</head>
<body>
<div class="app">
  <div class="hdr">
    <img src="Mascota.png" alt="Chile morron mascota" onerror="this.style.display='none'" />
    <h1>Tabla Periodica y Enlaces Quimicos</h1>
    <button id="btnDonar" class="btn-donar" type="button" onclick="window.open('https://tu-enlace-de-donativos.com','_blank','noopener,noreferrer')">Dona por favor, nos ayudaría mucho para seguir dándole más actualización</button>
  </div>

  <input id="q" class="search" type="text" placeholder="Buscar por Z, símbolo, nombre o peso (ej. 15.999)" />

  <div class="confirm-row">
    <button id="c1" class="btn-c" type="button">Confirmar Elem 1</button>
    <button id="c2" class="btn-c" type="button">Confirmar Elem 2</button>
  </div>

  <div id="bondBox" class="card status-box">
    <div id="bondTitle" class="status-title">Clasificación pendiente: confirma Elemento 1 y Elemento 2.</div>
    <div id="bondDetail" class="desc"></div>
  </div>

  <div id="detailBox" class="card"></div>

  <div class="slot slot-1">
    <div id="s1Title" class="slot-title">Elemento 1 —</div>
    <div id="s1Sub" class="slot-sub">Sin confirmar</div>
    <div id="s1Hint" class="slot-hint">Toca un elemento y pulsa 'Confirmar Elem 1'.</div>
  </div>

  <div class="slot slot-2">
    <div id="s2Title" class="slot-title">Elemento 2 —</div>
    <div id="s2Sub" class="slot-sub">Sin confirmar</div>
    <div id="s2Hint" class="slot-hint">Toca un elemento y pulsa 'Confirmar Elem 2'.</div>
  </div>

  <div class="pt-scroll">
    <div id="ptBoard" class="pt-board"></div>
  </div>
</div>

let active = ELS.find(e => e.z === 8) || ELS[0];
let conf1 = null, conf2 = null;

const qEl = document.getElementById("q");
const ptBoard = document.getElementById("ptBoard");
const detailEl = document.getElementById("detailBox");

function catLabel(cat){
  if(cat === "mt") return "Metaloide";
  if(cat === "nm") return "No metal";
  if(cat === "ng") return "Gas noble";
  return "Metal";
}

function renderDetail(){
  const semi = active.cat === "mt" ? active.s : "-";
  detailEl.innerHTML = `
    <div class="info-top"><span class="ring"></span><span>${active.n} (Z = ${active.z})</span></div>
    <div class="meta">Peso atómico: ${active.w} u</div>
    <div class="meta">Tipo: ${catLabel(active.cat)} | Semiconductor: ${semi}</div>
    <div class="desc">${active.d}</div>
  `;
}

function renderSlots(){
  const s1T = document.getElementById("s1Title");
  const s1S = document.getElementById("s1Sub");
  const s1H = document.getElementById("s1Hint");
  const s2T = document.getElementById("s2Title");
  const s2S = document.getElementById("s2Sub");
  const s2H = document.getElementById("s2Hint");

  if(conf1){
    s1T.textContent = `Elemento 1 — ${conf1.s}`;
    s1S.textContent = `${conf1.n} (Z = ${conf1.z}) · χ = ${conf1.en}`;
    s1H.textContent = `Tipo: ${catLabel(conf1.cat)} · Peso: ${conf1.w} u`;
  } else {
    s1T.textContent = "Elemento 1 —";
    s1S.textContent = "Sin confirmar";
    s1H.textContent = "Toca un elemento y pulsa 'Confirmar Elem 1'.";
  }

  if(conf2){
    s2T.textContent = `Elemento 2 — ${conf2.s}`;
    s2S.textContent = `${conf2.n} (Z = ${conf2.z}) · χ = ${conf2.en}`;
    s2H.textContent = `Tipo: ${catLabel(conf2.cat)} · Peso: ${conf2.w} u`;
  } else {
    s2T.textContent = "Elemento 2 —";
    s2S.textContent = "Sin confirmar";
    s2H.textContent = "Toca un elemento y pulsa 'Confirmar Elem 2'.";
  }

  const bTitle = document.getElementById("bondTitle");
  const bDetail = document.getElementById("bondDetail");
  if(!conf1 || !conf2){
    bTitle.textContent = "Clasificación pendiente: confirma Elemento 1 y Elemento 2.";
    bDetail.textContent = "";
    return;
  }
  const diff = Math.abs(conf1.en - conf2.en);
  const m1 = conf1.cat === "m", m2 = conf2.cat === "m";
  let tipo = "Covalente no polar";
  if(m1 && m2) tipo = "Enlace metálico";
  else if(diff >= 1.7 || (m1 !== m2)) tipo = "Enlace iónico";
  else if(diff >= 0.4) tipo = "Covalente polar";
  bTitle.textContent = `${tipo} (${conf1.s} + ${conf2.s})`;
  bDetail.textContent = `Δχ = ${diff.toFixed(2)} · ${conf1.n} (χ ${conf1.en}) y ${conf2.n} (χ ${conf2.en})`;
}

function makeTile(el, matches){
  const b = document.createElement("button");
  b.type = "button";
  const cls = ["el-tile",
    el.cat === "mt" ? "cat-metalloid" :
    el.cat === "nm" ? "cat-nonmetal" :
    el.cat === "ng" ? "cat-noble" : "cat-metal"
  ];
  if(active.z === el.z) cls.push("active");
  if(!matches) cls.push("dim");
  b.className = cls.join(" ");
  b.innerHTML = `<div class="el-z">${el.z}</div><div class="el-s">${el.s}</div>`;
  b.onclick = () => { active = el; renderDetail(); renderGrid(); };
  return b;
}

function renderGrid(){
  const f = qEl.value.trim().toLowerCase();
  const isMatch = (e) => !f || String(e.z) === f || e.s.toLowerCase().includes(f) || e.n.toLowerCase().includes(f) || String(e.w).includes(f);
  const byPos = new Map(ELS.map(e => [`${e.row}-${e.col}`, e]));

  ptBoard.innerHTML = "";
  for(let r = 1; r <= 7; r++){
    const rowDiv = document.createElement("div");
    rowDiv.className = "pt-row";
    for(let c = 1; c <= 18; c++){
      if(r === 6 && c === 3){
        const sp = document.createElement("div");
        sp.className = "pt-spacer";
        sp.textContent = "57-71";
        rowDiv.appendChild(sp);
        continue;
      }
      if(r === 7 && c === 3){
        const sp = document.createElement("div");
        sp.className = "pt-spacer";
        sp.textContent = "89-103";
        rowDiv.appendChild(sp);
        continue;
      }
      const el = byPos.get(`${r}-${c}`);
      if(el){
        rowDiv.appendChild(makeTile(el, isMatch(el)));
      } else {
        rowDiv.appendChild(document.createElement("div"));
      }
    }
    ptBoard.appendChild(rowDiv);
  }

  const gap = document.createElement("div");
  gap.className = "pt-gap";
  ptBoard.appendChild(gap);

  for(let r = 8; r <= 9; r++){
    const rowDiv = document.createElement("div");
    rowDiv.className = "pt-row";
    for(let c = 1; c <= 18; c++){
      const el = byPos.get(`${r}-${c}`);
      if(el){
        rowDiv.appendChild(makeTile(el, isMatch(el)));
      } else {
        rowDiv.appendChild(document.createElement("div"));
      }
    }
    ptBoard.appendChild(rowDiv);
  }
}

document.getElementById("c1").onclick = () => { conf1 = active; renderSlots(); };
document.getElementById("c2").onclick = () => { conf2 = active; renderSlots(); };
qEl.oninput = renderGrid;

renderDetail();
renderSlots();
renderGrid();
</script>
</body>
